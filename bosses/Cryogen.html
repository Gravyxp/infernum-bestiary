<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BOSS_DATA: CRYOGEN</title>
    <style>
        :root {
            --cryo-bright: #00f2ff;
            --cryo-deep: #051525;
            --ice-glare: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0; padding: 0;
            background: var(--cryo-deep);
            color: #e0faff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        /* Эффект падающего снега */
        .snow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
            background-image: radial-gradient(circle, #fff 1px, transparent 1px);
            background-size: 50px 50px;
            animation: snowFall 10s linear infinite;
        }

        .ice-frame {
            width: 90vw; height: 85vh;
            display: flex;
            background: rgba(10, 30, 50, 0.7);
            border: 2px solid var(--cryo-bright);
            position: relative;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 40px var(--cryo-bright), inset 0 0 20px var(--cryo-bright);
            clip-path: polygon(5% 0%, 95% 0%, 100% 5%, 100% 95%, 95% 100%, 5% 100%, 0% 95%, 0% 5%);
        }

        .ice-visual {
            flex: 1.3; display: flex; justify-content: center; align-items: center;
            border-right: 1px solid var(--cryo-bright);
            background: radial-gradient(circle, rgba(0, 242, 255, 0.1) 0%, transparent 80%);
        }

        .ice-visual img {
            max-width: 75%;
            filter: drop-shadow(0 0 25px var(--cryo-bright));
            animation: rotateIce 20s linear infinite;
        }

        .ice-data {
            flex: 1; padding: 60px;
            display: flex; flex-direction: column; justify-content: center;
        }

        h1 {
            font-size: 55px; color: var(--cryo-bright);
            text-shadow: 0 0 15px var(--cryo-bright);
            margin: 0; letter-spacing: 5px;
        }

        .stats {
            list-style: none; padding: 0; font-size: 24px; line-height: 2.5;
            border-left: 2px solid var(--cryo-bright); padding-left: 20px;
            margin: 30px 0;
        }

        .stats b { color: #fff; text-shadow: 0 0 5px var(--cryo-bright); }

        .btn-cryo {
            padding: 15px 40px; border: 1px solid var(--cryo-bright);
            background: transparent; color: var(--cryo-bright);
            text-decoration: none; width: fit-content;
            transition: 0.5s; font-weight: bold;
        }

        .btn-cryo:hover {
            background: var(--cryo-bright); color: var(--cryo-deep);
            box-shadow: 0 0 30px var(--cryo-bright);
        }

        @keyframes snowFall {
            from { background-position: 0 0; }
            to { background-position: 500px 1000px; }
        }

        @keyframes rotateIce {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="snow"></div>
    <div class="ice-frame">
        <div class="ice-visual">
            <img src="../images/Cryogen.gif" alt="Cryogen">
        </div>
        <div class="ice-data">
            <p style="letter-spacing: 3px; color: var(--cryo-bright);">SYSTEM STATUS: FROZEN</p>
            <h1>CRYOGEN</h1>
<ul class="stats">
    <li><b>HEALTH:</b> 44,000 / 70,400</li>
    <li><b>DAMAGE:</b> 80 / 128 (Contact)</li>
    <li><b>DEFENSE:</b> 20 (Physical)</li>
    <li><b>TEMP:</b> -273°C</li>
</ul>
            <a href="../bestiary/bestiary.html" class="btn-cryo">_ICE_MELT_BACK</a>
        </div>
    </div>
</body>
</html>
