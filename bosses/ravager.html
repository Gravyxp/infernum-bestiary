<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CONSTRUCT_ZERO // RAVAGER</title>
    <style>
        :root { --red: #ff3333; --dark-grey: #222222; --light-grey: #cccccc; }
        body { margin: 0; background: #0a0a0a; overflow: hidden; font-family: 'Orbitron', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--light-grey); }

        /* Фоновая сетка и движущиеся частицы */
        .tech-grid { position: absolute; width: 100%; height: 100%; background-image: linear-gradient(0deg, transparent 95%, rgba(255,51,51,0.1) 100%), linear-gradient(90deg, transparent 95%, rgba(255,51,51,0.1) 100%); background-size: 50px 50px; animation: gridMove 20s linear infinite; opacity: 0.2; }
        .sparks { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .spark { position: absolute; background: var(--red); border-radius: 50%; animation: sparkBurst 2s ease-out forwards; opacity: 0; }

        .container { width: 90vw; height: 85vh; border: 2px solid var(--red); background: rgba(0,0,0,0.95); position: relative; display: flex; box-shadow: 0 0 80px rgba(255,51,51,0.3); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 90%, 10% 80%, 10% 20%, 0 10%); /* Сложная рамка */ }

        .visual-panel { flex: 1.5; display: flex; justify-content: center; align-items: center; border-right: 1px solid var(--dark-grey); background: radial-gradient(circle, rgba(255,51,51,0.1) 0%, transparent 70%); }
        .visual-panel img { width: 75%; filter: drop-shadow(0 0 50px var(--red)) grayscale(0.1); animation: impactShake 0.1s infinite alternate; }

        .data-panel { flex: 1; padding: 70px; display: flex; flex-direction: column; justify-content: center; }
        .tagline { font-size: 14px; letter-spacing: 3px; color: var(--red); margin-bottom: 10px; }
        h1 { font-size: 55px; margin: 0; text-transform: uppercase; letter-spacing: 8px; color: white; text-shadow: 0 0 20px var(--red); }
        
        .status-indicators { display: flex; margin: 30px 0; border-bottom: 1px solid var(--dark-grey); padding-bottom: 20px; }
        .indicator { width: 20px; height: 20px; background: var(--red); border-radius: 50%; margin-right: 15px; box-shadow: 0 0 15px var(--red); animation: pulse 1.5s infinite alternate; }
        .indicator:nth-child(2) { background: var(--light-grey); box-shadow: 0 0 15px var(--light-grey); animation-delay: 0.5s; }

        .stats-detail { font-size: 18px; line-height: 2; color: var(--light-grey); }
        .stats-detail b { color: var(--red); text-transform: uppercase; }

        .action-button { margin-top: 50px; padding: 18px 45px; border: 2px solid var(--red); color: var(--red); text-decoration: none; text-align: center; transition: 0.4s; font-weight: bold; letter-spacing: 3px; background: transparent; }
        .action-button:hover { background: var(--red); color: black; box-shadow: 0 0 50px var(--red); transform: translateY(-5px); }

        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 50px 50px; } }
        @keyframes sparkBurst { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes impactShake { 0% { transform: translate(1px, 0); } 100% { transform: translate(-1px, 0); } }
        @keyframes pulse { from { box-shadow: 0 0 5px var(--red); } to { box-shadow: 0 0 25px var(--red); } }
    </style>
</head>
<body>
    <div class="tech-grid"></div>
    <div class="sparks">
        <div class="spark" style="top: 20%; left: 30%;"></div>
        <div class="spark" style="top: 70%; left: 60%; animation-delay: 0.7s;"></div>
    </div>
    <div class="container">
        <div class="visual-panel">
            <img src="../images/Ravager.gif">
        </div>
        <div class="data-panel">
            <div class="tagline">// HEAVY_ASSAULT_UNIT //</div>
            <h1>RAVAGER</h1>
            <div class="status-indicators">
                <div class="indicator"></div>
                <div class="indicator"></div>
                <div class="indicator"></div>
            </div>
            <div class="stats-detail">
                STATUS: <b>CRITICAL_THREAT</b><br>
                HEALTH: <b>136,000 / 217,600</b><br>
                DEFENSE: <b>60 (999 during jumps)</b><br>
                PRIMARY ATK: <b>MAGMA_BARRAGE</b>
            </div>
            <a href="../bestiary/bestiary.html" class="action-button">_ENGAGE_PROTOCOL</a>
        </div>
    </div>
</body>
</html>
