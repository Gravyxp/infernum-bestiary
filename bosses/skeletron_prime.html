<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>UNIT_STATUS: SKELETRON_PRIME</title>
    <style>
        :root {
            --prime-gray: #b0b0b0;
            --prime-dark: #0f0f0f;
            --prime-red: #ff3333;
            --prime-blue: #33aaff;
        }

        body {
            margin: 0; padding: 0;
            background: var(--prime-dark);
            color: var(--prime-gray);
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            position: relative;
        }

        /* Эффект мерцающего сканирования */
        .scan-line-effect {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(176, 176, 176, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(176, 176, 176, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: scanline 8s linear infinite;
            z-index: 1;
            opacity: 0.4;
        }

        /* Главный фрейм UI */
        .prime-frame {
            width: 90vw; height: 85vh;
            display: flex;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--prime-gray);
            position: relative;
            box-shadow: 0 0 60px rgba(176, 176, 176, 0.4);
            border-radius: 15px;
            overflow: hidden;
            z-index: 2;
        }

        /* Визуальная секция */
        .visual-section {
            flex: 1.3;
            display: flex; justify-content: center; align-items: center;
            border-right: 1px solid var(--prime-gray);
            background: radial-gradient(circle, rgba(176,176,176,0.08) 0%, transparent 60%);
            position: relative;
        }

        .visual-section img {
            max-width: 80%;
            filter: drop-shadow(0 0 25px rgba(176,176,176,0.8));
            animation: primeRotate 10s linear infinite;
        }

        /* Статус-индикаторы рук */
        .arm-indicator {
            position: absolute; width: 20px; height: 20px; border-radius: 50%;
            background: var(--prime-red);
            box-shadow: 0 0 15px var(--prime-red);
            animation: armGlow 2s ease-in-out infinite alternate;
        }
        .arm-indicator:nth-child(1) { top: 15%; left: 15%; background: var(--prime-blue); box-shadow: 0 0 15px var(--prime-blue); } /* Laser Arm */
        .arm-indicator:nth-child(2) { top: 15%; right: 15%; } /* Vice Arm */
        .arm-indicator:nth-child(3) { bottom: 15%; left: 15%; } /* Saw Arm */
        .arm-indicator:nth-child(4) { bottom: 15%; right: 15%; background: var(--prime-blue); box-shadow: 0 0 15px var(--prime-blue); } /* Cannon Arm */

        /* Информационная секция */
        .info-section {
            flex: 1;
            padding: 60px;
            display: flex; flex-direction: column; justify-content: center;
        }

        .header-text {
            font-size: 18px;
            color: var(--prime-blue);
            text-shadow: 0 0 10px var(--prime-blue);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 48px;
            color: var(--prime-red);
            text-shadow: 0 0 20px var(--prime-red);
            margin: 0 0 30px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-bottom: 2px solid var(--prime-gray);
            padding-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
            font-size: 18px;
            line-height: 1.6;
        }

        .stats-grid div {
            background: rgba(50,50,50,0.4);
            padding: 15px;
            border-left: 3px solid var(--prime-gray);
        }

        .stats-grid b {
            color: white;
            text-shadow: 0 0 5px var(--prime-gray);
        }

        .status-report {
            font-size: 14px;
            color: var(--prime-blue);
            margin-top: 20px;
            text-align: right;
        }

        .action-button {
            display: inline-block;
            margin-top: 50px;
            padding: 12px 30px;
            background: transparent;
            color: var(--prime-gray);
            border: 2px solid var(--prime-gray);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.3s ease-in-out;
        }
        .action-button:hover {
            background: var(--prime-red);
            color: var(--prime-dark);
            border-color: var(--prime-red);
            box-shadow: 0 0 30px var(--prime-red);
        }

        /* Анимации */
        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }
        @keyframes primeRotate {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        @keyframes armGlow {
            0%, 100% { box-shadow: 0 0 15px var(--prime-red); }
            50% { box-shadow: 0 0 30px var(--prime-red); }
        }
    </style>
</head>
<body>
    <div class="scan-line-effect"></div>
    <div class="prime-frame">
        <div class="visual-section">
            <img src="../images/SkeletronPrime.gif" alt="Skeletron Prime">
            <div class="arm-indicator"></div>
            <div class="arm-indicator"></div>
            <div class="arm-indicator"></div>
            <div class="arm-indicator"></div>
        </div>
        <div class="info-section">
            <p class="header-text">// MECH_ENTITY_DESIGNATION</p>
            <h1>SKELETRON PRIME</h1>
            <div class="stats-grid">
                <div><b>HEALTH (HEAD):</b> 56,000 / 90,000</div>
                <div><b>DEFENSE (HEAD):</b> 25</div>
                <div><b>DAMAGE (MELEE):</b> 120</div>
                <div><b>DAMAGE (LASER):</b> 100</div>
                <div><b>ARMS STATUS:</b> OPERATIONAL</div>
                <div><b>PRIMARY THREAT:</b> SPIN ATTACK</div>
            </div>
            <p class="status-report">
                _WARNING: TARGET_ACQUISITION_MODE_ACTIVE_
            </p>
            <a href="../bestiary/bestiary.html" class="action-button">_ENGAGE_PROTOCOL</a>
        </div>
    </div>
</body>
</html>
