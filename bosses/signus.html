<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Profile - Signus</title>
    <style>
        /* ГЛОБАЛЬНЫЕ СТИЛИ */
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; 
            background: #0a000f; /* Глубокий астральный фиолетовый */
            color: #eeeeee;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* КАРТОЧКА БОССА */
        .boss-container {
            display: flex;
            width: 90vw;
            height: 85vh;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            padding: 40px;
            background: rgba(15, 0, 30, 0.9);
            border-radius: 20px;
            /* АСТРАЛЬНЫЙ ФИОЛЕТОВЫЙ КОНТУР */
            border: 2px solid #ff00ff;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
        }

        /* ЛЕВАЯ ЧАСТЬ (СПРАЙТ) */
        .boss-visual {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .boss-visual img {
            max-width: 100%;
            max-height: 70vh;
            image-rendering: pixelated; 
            filter: drop-shadow(0 0 40px #ff00ff);
            /* Анимация призрачного мерцания */
            animation: ghostAnim 2s infinite linear;
        }

        /* ПРАВАЯ ЧАСТЬ (ИНФОРМАЦИЯ) */
        .boss-data {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .boss-data h1 {
            font-size: 50px;
            margin: 0 0 30px 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #ff00ff;
        }

        /* ХАРАКТЕРИСТИКИ */
        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stats-list li {
            font-size: 24px; 
            margin-bottom: 20px;
            display: flex;
            border-bottom: 1px solid rgba(255, 0, 255, 0.2);
            padding-bottom: 10px;
        }

        .stats-list li b {
            color: #ff00ff;
            width: 180px;
            text-transform: uppercase;
            font-size: 18px; 
            letter-spacing: 1px;
        }

        .spawn-item {
            color: #da70d6;
            font-weight: bold;
        }

        /* КНОПКА ВОЗВРАТА */
        .btn-back {
            margin-top: 40px;
            font-size: 20px;
            color: #fff;
            text-decoration: none;
            border: 2px solid #ff00ff;
            padding: 12px 35px;
            border-radius: 10px;
            width: fit-content;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-back:hover {
            background: #ff00ff;
            color: #fff;
            box-shadow: 0 0 25px #ff00ff;
            transform: scale(1.05);
        }

        /* АНИМАЦИЯ ПРИЗРАКА */
        @keyframes ghostAnim {
            0%, 100% { transform: translateY(0); opacity: 1; filter: hue-rotate(0deg) drop-shadow(0 0 40px #ff00ff); }
            50% { transform: translateY(-20px); opacity: 0.7; filter: hue-rotate(45deg) drop-shadow(0 0 60px #00ffff); }
        }
    </style>
</head>
<body>

    <div class="boss-container">
        <div class="boss-visual">
            <img src="../images/Signus.gif" alt="Signus">
        </div>

        <div class="boss-data">
            <h1>Signus, Envoy of the Devourer</h1>
            <ul class="stats-list">
                <li><b>Total HP:</b> 600,000</li>
                <li><b>Damage:</b> 320</li>
                <li><b>Defense:</b> 70</li>
                <li><b>Spawn:</b> <span class="spawn-item">Rune of Kos (The Underworld)</span></li>
                <li><b>Music:</b> Servant of the Scourge</li>
            </ul>
            
            <a href="../bestiary/bestiary.html" class="btn-back">Return to bestiary</a>
        </div>
    </div>

</body>
</html>
