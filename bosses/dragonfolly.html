<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Profile - The Dragonfolly</title>
    <style>
        /* ГЛОБАЛЬНЫЕ СТИЛИ */
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; 
            background: #0d0d00; /* Глубокий тёмно-зеленоватый фон */
            color: #eeeeee;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* КАРТОЧКА БОССА */
        .boss-container {
            display: flex;
            width: 90vw;
            height: 85vh;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            padding: 40px;
            background: rgba(20, 20, 0, 0.9);
            border-radius: 20px;
            /* ЭЛЕКТРИЧЕСКИЙ ЖЕЛТЫЙ КОНТУР */
            border: 2px solid #ffff00;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.3);
        }

        /* ЛЕВАЯ ЧАСТЬ (СПРАЙТ) */
        .boss-visual {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .boss-visual img {
            max-width: 100%;
            max-height: 70vh;
            image-rendering: pixelated; 
            filter: drop-shadow(0 0 40px #ffee00);
            /* Анимация с эффектом быстрой тряски */
            animation: frenzyAnim 0.2s infinite alternate;
        }

        /* ПРАВАЯ ЧАСТЬ (ИНФОРМАЦИЯ) */
        .boss-data {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .boss-data h1 {
            font-size: 50px;
            margin: 0 0 30px 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #ffff00;
            font-style: italic;
        }

        /* ХАРАКТЕРИСТИКИ */
        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stats-list li {
            font-size: 24px; 
            margin-bottom: 20px;
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 0, 0.2);
            padding-bottom: 10px;
        }

        .stats-list li b {
            color: #ffff00;
            width: 180px;
            text-transform: uppercase;
            font-size: 18px; 
            letter-spacing: 1px;
        }

        .spawn-item {
            color: #ccff00;
            font-weight: bold;
        }

        /* КНОПКА ВОЗВРАТА */
        .btn-back {
            margin-top: 40px;
            font-size: 20px;
            color: #fff;
            text-decoration: none;
            border: 2px solid #ffff00;
            padding: 12px 35px;
            border-radius: 10px;
            width: fit-content;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-back:hover {
            background: #ffff00;
            color: #000;
            box-shadow: 0 0 25px #ffff00;
            transform: scale(1.05);
        }

        /* АНИМАЦИЯ БЕЗУМИЯ */
        @keyframes frenzyAnim {
            from { transform: translateY(0) translateX(0); }
            to { transform: translateY(-5px) translateX(2px); }
        }
    </style>
</head>
<body>

    <div class="boss-container">
        <div class="boss-visual">
            <img src="../images/Dragonfolly.gif" alt="The Dragonfolly">
        </div>

        <div class="boss-data">
            <h1>The Dragonfolly</h1>
            <ul class="stats-list">
                <li><b>Total HP:</b> 656,000</li>
                <li><b>Damage:</b> 250</li>
                <li><b>Defense:</b> 80</li>
                <li><b>Spawn:</b> <span class="spawn-item">Exotic Pheromones (Jungle)</span></li>
                <li><b>Music:</b> Sanctuary</li>
            </ul>
            
            <a href="../bestiary/bestiary.html" class="btn-back">Return to bestiary</a>
        </div>
    </div>

</body>
</html>
