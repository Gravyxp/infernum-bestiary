<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>STAR_GOD // ASTRUM_DEUS</title>
    <style>
        :root { --purple: #4b0082; --cyan: #00ffff; --gold: #ffd700; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Exo 2', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }

        /* Сложный параллакс фона */
        .galaxy-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; animation: galaxyMove 120s linear infinite; }
        .galaxy-layer.far { background-image: url('https://i.imgur.com/8Qp7rW6.png'); opacity: 0.3; } /* Дальние звезды */
        .galaxy-layer.mid { background-image: url('https://i.imgur.com/4hJ1f0X.png'); animation-duration: 90s; opacity: 0.5; } /* Туманность (пример) */
        .galaxy-layer.close { background-image: url('https://i.imgur.com/CpH02t7.png'); animation-duration: 60s; opacity: 0.8; } /* Ближние звезды/пыль (пример) */

        .frame { width: 95vw; height: 90vh; border: 2px solid var(--purple); background: rgba(5, 0, 15, 0.9); backdrop-filter: blur(8px); position: relative; display: flex; border-radius: 20px; box-shadow: 0 0 120px var(--purple); z-index: 5; }

        .visual-area { flex: 1.5; display: flex; justify-content: center; align-items: center; position: relative; border-right: 1px solid rgba(255,255,255,0.1); }
        .visual-area img { width: 90%; filter: drop-shadow(0 0 60px var(--cyan)) hue-rotate(280deg); transform: rotate(-15deg); animation: serpentSway 5s infinite ease-in-out; }
        
        /* Пульсирующие звезды вокруг босса */
        .boss-star { position: absolute; width: 10px; height: 10px; background: white; border-radius: 50%; box-shadow: 0 0 15px var(--cyan); animation: starPulse 2s infinite alternate; }

        .info-area { flex: 1; padding: 70px; color: white; display: flex; flex-direction: column; justify-content: center; }
        .entity-type { font-size: 14px; letter-spacing: 5px; color: var(--cyan); margin-bottom: 10px; }
        h1 { font-size: 65px; color: var(--gold); margin: 0; text-shadow: 0 0 30px var(--gold); letter-spacing: 8px; font-weight: 200; border-bottom: 2px solid var(--purple); padding-bottom: 10px; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 40px 0; }
        .stat-item { background: rgba(75,0,130,0.1); padding: 20px; border-left: 3px solid var(--cyan); }
        .stat-item b { color: var(--gold); display: block; font-size: 12px; opacity: 0.8; }

        .btn-back { padding: 18px 45px; border: 2px solid var(--gold); color: var(--gold); text-decoration: none; text-align: center; transition: 0.4s; font-size: 18px; width: fit-content; background: transparent; }
        .btn-back:hover { background: var(--gold); color: black; box-shadow: 0 0 50px var(--gold); transform: scale(1.05); }

        @keyframes galaxyMove { from { background-position: 0 0; } to { background-position: 100% 100%; } }
        @keyframes serpentSway { 0%, 100% { transform: rotate(-15deg) translateY(0); } 50% { transform: rotate(-10deg) translateY(-25px); } }
        @keyframes starPulse { from { transform: scale(0.8); opacity: 0.5; } to { transform: scale(1.2); opacity: 1; } }
    </style>
</head>
<body>
    <div class="galaxy-layer far"></div>
    <div class="galaxy-layer mid"></div>
    <div class="galaxy-layer close"></div>
    <div class="frame">
        <div class="visual-area">
            <div class="boss-star" style="top: 25%; left: 20%; animation-delay: 0s;"></div>
            <div class="boss-star" style="top: 60%; left: 80%; animation-delay: 1s;"></div>
            <img src="../images/Astrum_Deus.png">
        </div>
        <div class="info-area">
            <div class="entity-type">// COSMIC_ANOMALY //</div>
            <h1>ASTRUM DEUS</h1>
            <div class="stat-grid">
                <div class="stat-item"><b>HEALTH</b> 180,000 / 288,000</div>
                <div class="stat-item"><b>SPEED</b> Hyperspace</div>
                <div class="stat-item"><b>DEFENSE</b> 50 units</div>
                <div class="stat-item"><b>THREAT</b> Omnipresent</div>
            </div>
            <a href="../bestiary/bestiary.html" class="btn-back">_VOID_TRAVERSE</a>
        </div>
    </div>
</body>
</html>
