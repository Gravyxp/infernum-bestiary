<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ASTRAL_VIRUS: ASTRUM_AUREUS</title>
    <style>
        :root {
            --astral-purple: #9d00ff;
            --astral-cyan: #00eaff;
            --astral-dark: #0a0014;
        }

        body {
            margin: 0; padding: 0; background: var(--astral-dark);
            color: var(--astral-cyan); font-family: 'Courier New', Courier, monospace;
            overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        .cyber-grid {
            position: absolute; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--astral-purple) 1px, transparent 1px),
                linear-gradient(90deg, var(--astral-purple) 1px, transparent 1px);
            background-size: 60px 60px; opacity: 0.1;
            transform: perspective(500px) rotateX(60deg) translateY(-100px);
            animation: gridMove 5s linear infinite; z-index: 1;
        }

        .aureus-frame {
            width: 90vw; height: 85vh; display: flex;
            background: rgba(10, 0, 20, 0.85);
            border: 2px solid var(--astral-purple);
            box-shadow: 0 0 50px rgba(157, 0, 255, 0.4), inset 0 0 30px var(--astral-purple);
            z-index: 2; position: relative;
        }

        .visual-section {
            flex: 1.2; display: flex; justify-content: center; align-items: center;
            border-right: 2px solid var(--astral-cyan); background: radial-gradient(circle, rgba(0,234,255,0.1) 0%, transparent 60%);
        }

        .visual-section img {
            max-width: 80%; filter: drop-shadow(0 0 40px var(--astral-cyan)) saturate(1.5);
            animation: aureusStomp 2s infinite alternate;
        }

        .info-section {
            flex: 1; padding: 60px; display: flex; flex-direction: column; justify-content: center;
        }

        h1 {
            font-size: 45px; color: var(--astral-cyan);
            text-shadow: 0 0 15px var(--astral-cyan), 2px 2px 0 var(--astral-purple);
            margin: 0 0 10px 0; letter-spacing: 5px; text-transform: uppercase;
        }

        .sub-header { color: var(--astral-purple); font-weight: bold; margin-bottom: 30px; letter-spacing: 2px; }

        .data-box {
            border: 1px solid var(--astral-purple); background: rgba(157,0,255,0.05);
            padding: 25px; font-size: 18px; line-height: 2; color: white;
            box-shadow: inset 0 0 15px rgba(157,0,255,0.2);
        }
        .data-box b { color: var(--astral-cyan); text-shadow: 0 0 5px var(--astral-cyan); }

        .action-button {
            display: inline-block; margin-top: 40px; padding: 15px 30px;
            background: transparent; color: var(--astral-cyan);
            border: 2px solid var(--astral-cyan); text-decoration: none;
            font-weight: bold; letter-spacing: 2px; transition: 0.3s; width: fit-content;
        }
        .action-button:hover {
            background: var(--astral-cyan); color: var(--astral-dark);
            box-shadow: 0 0 30px var(--astral-cyan);
        }

        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 60px; } }
        @keyframes aureusStomp { 0% { transform: translateY(15px); } 100% { transform: translateY(-15px); } }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="aureus-frame">
        <div class="visual-section">
            <img src="../images/AstrumAureus.gif" alt="Astrum Aureus">
        </div>
        <div class="info-section">
            <h1>ASTRUM AUREUS</h1>
            <div class="sub-header">// ASTRAL INFECTION CYBORG //</div>
            <div class="data-box">
                <b>HEALTH:</b> 120,000 / 192,000<br>
                <b>DAMAGE:</b> 160 (Stomp) / 120 (Laser)<br>
                <b>DEFENSE:</b> 60<br>
                <b>BEHAVIOR:</b> Hostile, Highly Mobile
            </div>
            <a href="../bestiary/bestiary.html" class="action-button">_PURGE_INFECTION</a>
        </div>
    </div>
</body>
</html>
