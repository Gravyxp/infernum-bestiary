<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Profile - The Profaned Guardians</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; 
            background: #0a0700; 
            color: #eeeeee;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .boss-container {
            display: flex;
            width: 90vw;
            height: 85vh;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            padding: 40px;
            background: rgba(20, 15, 0, 0.9);
            border-radius: 20px;
            border: 2px solid #ffcc00;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
        }

        .boss-visual {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .boss-visual img {
            max-width: 100%;
            max-height: 70vh;
            image-rendering: pixelated; 
            filter: drop-shadow(0 0 40px #ffaa00);
            animation: floatAnim 3s ease-in-out infinite;
        }

        .boss-data {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .boss-data h1 {
            font-size: 50px;
            margin: 0 0 30px 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #ffcc00;
        }

        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stats-list li {
            font-size: 24px; 
            margin-bottom: 20px;
            display: flex;
            border-bottom: 1px solid rgba(255, 204, 0, 0.2);
            padding-bottom: 10px;
        }

        .stats-list li b {
            color: #ffcc00;
            width: 180px;
            text-transform: uppercase;
            font-size: 18px; 
            letter-spacing: 1px;
        }

        /* Оранжевый акцент для призывалки */
        .spawn-item {
            color: #ffaa00;
            font-style: italic;
        }

        .btn-back {
            margin-top: 40px;
            font-size: 20px;
            color: #fff;
            text-decoration: none;
            border: 2px solid #ffcc00;
            padding: 12px 35px;
            border-radius: 10px;
            width: fit-content;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-back:hover {
            background: #ffcc00;
            color: #000;
            box-shadow: 0 0 25px #ffcc00;
            transform: scale(1.05);
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
    </style>
</head>
<body>

    <div class="boss-container">
        <div class="boss-visual">
            <img src="../images/ProfanedGuardians.gif" alt="Profaned Guardians">
        </div>

        <div class="boss-data">
            <h1>The Profaned Guardians</h1>
            <ul class="stats-list">
                <li><b>Total HP:</b> 448,000</li>
                <li><b>Damage:</b> 220</li>
                <li><b>Defense:</b> 50</li>
                <li><b>Spawn:</b> <span class="spawn-item">Profaned Core (Hallow / Underworld)</span></li>
                <li><b>Music:</b> Unholy Ambush</li>
            </ul>
            
            <a href="../bestiary/bestiary.html" class="btn-back">← Назад в меню</a>
        </div>
    </div>

</body>
</html>
