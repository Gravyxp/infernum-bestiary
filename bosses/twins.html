<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TARGET_ACQUIRED: THE_TWINS</title>
    <style>
        :root {
            --reti-red: #ff1100;
            --spaz-green: #22ff00;
            --ui-bg: rgba(5, 5, 5, 0.9);
        }

        body {
            margin: 0; padding: 0;
            background: #000;
            color: white;
            font-family: 'Consolas', monospace;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        /* Сканирующая сетка на фоне */
        .overlay-grid {
            position: absolute; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        .main-frame {
            width: 95vw; height: 90vh;
            display: flex; flex-direction: column;
            border: 2px solid #333;
            background: var(--ui-bg);
            position: relative; z-index: 2;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        /* Верхняя панель со статусом */
        .header {
            height: 60px; border-bottom: 2px solid #333;
            display: flex; align-items: center; padding: 0 30px;
            justify-content: space-between;
            background: linear-gradient(90deg, rgba(255,17,0,0.2), rgba(34,255,0,0.2));
        }

        .content-split { display: flex; flex: 1; overflow: hidden; }

        /* Левая сторона - Ретинайзер */
        .side {
            flex: 1; display: flex; flex-direction: column;
            padding: 30px; position: relative;
            transition: 0.3s;
        }
        .reti-side { border-right: 1px dashed #444; }
        .reti-side:hover { background: rgba(255,17,0,0.05); }
        .spaz-side:hover { background: rgba(34,255,0,0.05); }

        .boss-preview {
            height: 50%; display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        .boss-preview img {
            max-width: 70%;
            filter: drop-shadow(0 0 20px var(--shadow-color));
            animation: float 4s ease-in-out infinite alternate;
        }

        h1 { font-size: 40px; margin: 20px 0; text-transform: uppercase; letter-spacing: 4px; }
        .reti-text { color: var(--reti-red); text-shadow: 0 0 10px var(--reti-red); }
        .spaz-text { color: var(--spaz-green); text-shadow: 0 0 10px var(--spaz-green); }

        .stats-box {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent-color);
            padding: 20px; font-size: 18px; line-height: 1.6;
        }

        /* Перекрестие прицела */
        .crosshair {
            position: absolute; width: 100px; height: 100px;
            border: 2px solid var(--accent-color);
            border-radius: 50%; opacity: 0.3;
            animation: spin 10s linear infinite;
        }

        .footer {
            height: 80px; border-top: 2px solid #333;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-back {
            color: #aaa; text-decoration: none; border: 1px solid #444;
            padding: 10px 40px; transition: 0.3s;
        }
        .btn-back:hover { color: #fff; border-color: #fff; background: #222; }

        @keyframes float {
            from { transform: translatey(0) rotate(-5deg); }
            to { transform: translatey(-20px) rotate(5deg); }
        }
        @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="overlay-grid"></div>
    
    <div class="main-frame">
        <div class="header">
            <span>STATUS: ANALYSIS IN PROGRESS...</span>
            <span style="color: #ffcc00;">[DANGER LEVEL: EXTREME]</span>
            <span>OBJECT ID: #002-TWINS</span>
        </div>

        <div class="content-split">
            <div class="side reti-side" style="--accent-color: var(--reti-red); --shadow-color: var(--reti-red);">
                <div class="boss-preview">
                    <div class="crosshair"></div>
                    <img src="../images/Retinazer.gif" alt="Retinazer">
                </div>
                <h1 class="reti-text">RETINAZER</h1>
                <div class="stats-box">
                    <b>HEALTH:</b> 45,000 / 72,000<br>
                    <b>DAMAGE:</b> 120 (Death Laser)<br>
                    <b>TYPE:</b> Ranged Support
                </div>
            </div>

            <div class="side spaz-side" style="--accent-color: var(--spaz-green); --shadow-color: var(--spaz-green);">
                <div class="boss-preview">
                    <div class="crosshair"></div>
                    <img src="../images/Spazmatism.gif" alt="Spazmatism">
                </div>
                <h1 class="spaz-text">SPAZMATISM</h1>
                <div class="stats-box">
                    <b>HEALTH:</b> 45,000 / 72,000<br>
                    <b>DAMAGE:</b> 140 (Cursed Fire)<br>
                    <b>TYPE:</b> Melee Aggressor
                </div>
            </div>
        </div>

        <div class="footer">
            <a href="../bestiary/bestiary.html" class="btn-back">_DISCONNECT_SYSTEM</a>
        </div>
    </div>
</body>
</html>
