<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Profile - Providence</title>
    <style>
        /* ГЛОБАЛЬНЫЕ СТИЛИ */
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; 
            background: #0f0a00; /* Темный янтарный фон */
            color: #eeeeee;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* КАРТОЧКА БОССА */
        .boss-container {
            display: flex;
            width: 90vw;
            height: 85vh;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            padding: 40px;
            background: rgba(25, 15, 0, 0.9);
            border-radius: 20px;
            /* СИЯЮЩИЙ ОРАНЖЕВЫЙ КОНТУР */
            border: 2px solid #ff6600;
            box-shadow: 0 0 40px rgba(255, 102, 0, 0.4), inset 0 0 20px rgba(255, 200, 0, 0.2);
        }

        /* ЛЕВАЯ ЧАСТЬ (СПРАЙТ) */
        .boss-visual {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .boss-visual img {
            max-width: 100%;
            max-height: 75vh;
            image-rendering: pixelated; 
            filter: drop-shadow(0 0 60px #ffcc00);
            /* Анимация: медленное величественное дыхание */
            animation: holyGlow 5s ease-in-out infinite alternate;
        }

        /* ПРАВАЯ ЧАСТЬ (ИНФОРМАЦИЯ) */
        .boss-data {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .boss-data h1 {
            font-size: 45px;
            margin: 0 0 30px 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 20px #ff6600;
        }

        /* ХАРАКТЕРИСТИКИ */
        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stats-list li {
            font-size: 24px; 
            margin-bottom: 20px;
            display: flex;
            border-bottom: 1px solid rgba(255, 102, 0, 0.3);
            padding-bottom: 10px;
        }

        .stats-list li b {
            color: #ff9900;
            width: 180px;
            text-transform: uppercase;
            font-size: 18px; 
            letter-spacing: 1px;
        }

        .spawn-item {
            color: #fffb00;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 251, 0, 0.5);
        }

        /* КНОПКА ВОЗВРАТА */
        .btn-back {
            margin-top: 40px;
            font-size: 20px;
            color: #fff;
            text-decoration: none;
            border: 2px solid #ff6600;
            padding: 12px 35px;
            border-radius: 10px;
            width: fit-content;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-back:hover {
            background: #ff6600;
            color: #000;
            box-shadow: 0 0 30px #ff6600;
            transform: scale(1.05);
        }

        /* АНИМАЦИЯ СВЯЩЕННОГО СИЯНИЯ */
        @keyframes holyGlow {
            0% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 40px #ffcc00); }
            100% { transform: scale(1.05) translateY(-15px); filter: drop-shadow(0 0 80px #ff6600); }
        }
    </style>
</head>
<body>

    <div class="boss-container">
        <div class="boss-visual">
            <img src="../images/Providence,_the_Profaned_Goddess.gif" alt="Providence, the Profaned Goddess">
        </div>

        <div class="boss-data">
            <h1>Providence, The Profaned Goddess</h1>
            <ul class="stats-list">
                <li><b>Total HP:</b> 1,120,000</li>
                <li><b>Damage:</b> 300</li>
                <li><b>Defense:</b> 100</li>
                <li><b>Spawn:</b> <span class="spawn-item">Profaned Core (Hallow / Underworld)</span></li>
                <li><b>Music:</b> Adventure's End</li>
            </ul>
            
            <a href="../bestiary/bestiary.html" class="btn-back">Return to bestiary</a>
        </div>
    </div>

</body>
</html>
