<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JUNGLE_CORE: PLANTERA</title>
    <style>
        :root {
            --plantera-green: #32cd32;
            --plantera-pink: #ff69b4;
            --plantera-dark: #0f1a0f;
        }

        body {
            margin: 0; padding: 0;
            background: var(--plantera-dark);
            color: var(--plantera-green);
            font-family: 'Georgia', serif;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        .jungle-bg-effect {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(50,205,50,0.1) 0%, transparent 70%);
            animation: windRustle 20s linear infinite;
            filter: blur(10px); z-index: 1;
        }

        .plantera-frame {
            width: 90vw; height: 85vh;
            display: flex;
            background: rgba(10, 20, 10, 0.9);
            border: 4px solid var(--plantera-green);
            position: relative;
            box-shadow: 0 0 80px rgba(50, 205, 50, 0.5);
            border-radius: 60px 10px 60px 10px;
            overflow: hidden; z-index: 2;
        }

        .visual-section {
            flex: 1.3;
            display: flex; justify-content: center; align-items: center;
            border-right: 2px solid var(--plantera-green);
            background: linear-gradient(135deg, rgba(30,60,30,0.5), rgba(5,10,5,0.5));
            position: relative; overflow: hidden;
        }

        .visual-section img {
            max-width: 80%;
            filter: drop-shadow(0 0 40px var(--plantera-green));
            animation: bloomPulse 6s ease-in-out infinite alternate;
        }

        .petal {
            position: absolute; width: 30px; height: 80px; background: rgba(255,105,180,0.2);
            border-radius: 50% / 10%; transform-origin: center bottom;
            animation: petalFloat 15s linear infinite;
            pointer-events: none; opacity: 0.8;
        }
        .petal:nth-child(1) { left: 10%; top: -20%; transform: rotate(20deg); animation-delay: 0s; }
        .petal:nth-child(2) { left: 40%; top: -30%; transform: rotate(-10deg); animation-delay: 5s; }

        .info-section {
            flex: 1; padding: 60px;
            display: flex; flex-direction: column; justify-content: center;
        }

        .header-title {
            font-size: 50px;
            color: var(--plantera-pink);
            text-shadow: 0 0 25px var(--plantera-pink), 0 0 10px #ff007f;
            margin: 0 0 20px 0;
            letter-spacing: 2px;
            text-align: center;
            position: relative;
        }
        .header-title::after {
            content: ''; position: absolute; bottom: -10px; left: 20%; width: 60%; height: 3px;
            background: linear-gradient(to right, transparent, var(--plantera-green), transparent);
        }

        .stats-detail {
            margin: 40px 0; font-size: 20px; line-height: 2;
            color: white; border-left: 4px solid var(--plantera-pink);
            padding-left: 25px;
            background: linear-gradient(90deg, rgba(255,105,180,0.08), transparent);
        }

        .stats-detail b {
            color: var(--plantera-green);
            text-shadow: 0 0 8px var(--plantera-green);
        }

        .action-button {
            display: inline-block; margin-top: 50px; padding: 15px 40px;
            background: var(--plantera-pink); color: var(--plantera-dark);
            text-decoration: none; text-transform: uppercase; font-weight: bold;
            letter-spacing: 2px; transition: 0.4s;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
            border-radius: 8px; text-align: center; width: fit-content; align-self: center;
        }
        .action-button:hover {
            background: var(--plantera-green);
            box-shadow: 0 0 50px var(--plantera-green);
            transform: scale(1.05);
        }

        @keyframes bloomPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 40px var(--plantera-green)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 60px var(--plantera-pink)); }
        }
        @keyframes petalFloat {
            0% { transform: translateY(0) rotate(20deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(120vh) rotate(180deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="jungle-bg-effect"></div>
    <div class="plantera-frame">
        <div class="visual-section">
            <img src="../images/Plantera.png" alt="Plantera">
            <div class="petal"></div>
            <div class="petal"></div>
        </div>
        <div class="info-section">
            <h1 class="header-title">PLANTERA</h1>
            <p style="text-align: center; color: #8fbc8f; font-style: italic;">"The jungle's wrath personified."</p>
            <div class="stats-detail">
                <b>HEALTH:</b> 42,000 / 67,200<br>
                <b>DAMAGE:</b> 110 (Contact) / 90 (Seed)<br>
                <b>DEFENSE:</b> 36 (Phase 1) / 10 (Phase 2)<br>
                <b>ENRAGE:</b> Outside Underground Jungle
            </div>
            <a href="../bestiary/bestiary.html" class="action-button">_RETREAT_TO_SURFACE</a>
        </div>
    </div>
</body>
</html>
