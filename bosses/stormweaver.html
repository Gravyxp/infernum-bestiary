<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Profile - The Storm Weaver</title>
    <style>
        /* ГЛОБАЛЬНЫЕ СТИЛИ */
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; 
            background: #00050a; /* Цвет ночного грозового неба */
            color: #eeeeee;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* КАРТОЧКА БОССА */
        .boss-container {
            display: flex;
            width: 90vw;
            height: 85vh;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            padding: 40px;
            background: rgba(0, 10, 25, 0.9);
            border-radius: 20px;
            /* НЕОНОВЫЙ ЦВЕТ МОЛНИИ */
            border: 2px solid #00d4ff;
            box-shadow: 0 0 35px rgba(0, 212, 255, 0.4);
        }

        /* ЛЕВАЯ ЧАСТЬ (СПРАЙТ) */
        .boss-visual {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .boss-visual img {
            max-width: 100%;
            max-height: 70vh;
            image-rendering: pixelated; 
            filter: drop-shadow(0 0 50px #00d4ff);
            /* Анимация: эффект пульсации энергии */
            animation: electricPulse 2s ease-in-out infinite alternate;
        }

        /* ПРАВАЯ ЧАСТЬ (ИНФОРМАЦИЯ) */
        .boss-data {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .boss-data h1 {
            font-size: 50px;
            margin: 0 0 30px 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #00d4ff;
        }

        /* ХАРАКТЕРИСТИКИ */
        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stats-list li {
            font-size: 24px; 
            margin-bottom: 20px;
            display: flex;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            padding-bottom: 10px;
        }

        .stats-list li b {
            color: #00d4ff;
            width: 180px;
            text-transform: uppercase;
            font-size: 18px; 
            letter-spacing: 1px;
        }

        .spawn-item {
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }

        /* КНОПКА ВОЗВРАТА */
        .btn-back {
            margin-top: 40px;
            font-size: 20px;
            color: #fff;
            text-decoration: none;
            border: 2px solid #00d4ff;
            padding: 12px 35px;
            border-radius: 10px;
            width: fit-content;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-back:hover {
            background: #00d4ff;
            color: #000;
            box-shadow: 0 0 30px #00d4ff;
            transform: scale(1.05);
        }

        /* АНИМАЦИЯ ЭЛЕКТРИЧЕСКОЙ ПУЛЬСАЦИИ */
        @keyframes electricPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 30px #00d4ff) brightness(1); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 60px #ffffff) brightness(1.2); }
        }
    </style>
</head>
<body>

    <div class="boss-container">
        <div class="boss-visual">
            <img src="../images/Storm_Weaver.png" alt="The Storm Weaver">
        </div>

        <div class="boss-data">
            <h1>The Storm Weaver</h1>
            <ul class="stats-list">
            <li><b>Total HP:</b> 640,000</li>
            <li><b>Damage:</b> 280</li>
            <li><b>Defense:</b> 0 (Head) / 100 (Body)</li>
            <li><b>Spawn:</b> <span class="spawn-item">Rune of Kos (Space)</span></li>
            <li><b>Music:</b> Interstellar Stomper</li>
        </ul>
            
            <a href="../bestiary/bestiary.html" class="btn-back">Return to bestiary</a>
        </div>
    </div>

</body>
</html>
