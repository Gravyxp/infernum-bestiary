<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSS_DATA: QUEEN BEE</title>
    <style>
        :root {
            --p: #ffd23f;
            --s: #d98f12;
            --bg: #120d01;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background: var(--bg);
            color: #eef7ff; font-family: 'Rajdhani','Courier New',monospace;
            min-height: 100vh; overflow-x: hidden;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }
        .aura {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(circle at 35% 50%, #ffd23f22 0%, transparent 60%);
            animation: pulse 6s ease-in-out infinite alternate;
        }
        .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .particles span {
            position: absolute; bottom: -20px; width: 6px; height: 6px;
            background: var(--p); border-radius: 50%; opacity: 0.5;
            box-shadow: 0 0 10px var(--p);
            animation: rise linear infinite;
        }
        .frame {
            position: relative; z-index: 2;
            width: 92vw; max-width: 1100px; min-height: 78vh;
            display: flex; flex-wrap: wrap;
            background: rgba(0,0,0,0.55);
            border: 2px solid var(--p);
            box-shadow: 0 0 45px #ffd23f66, inset 0 0 25px #ffd23f33;
            backdrop-filter: blur(6px);
            clip-path: polygon(3% 0, 97% 0, 100% 6%, 100% 94%, 97% 100%, 3% 100%, 0 94%, 0 6%);
        }
        .visual {
            flex: 1 1 360px; display: flex; justify-content: center; align-items: center;
            border-right: 1px solid #ffd23f55; padding: 30px; min-height: 320px;
            background: radial-gradient(circle, #ffd23f18 0%, transparent 75%);
        }
        .visual a { display: block; }
        .visual img {
            max-width: 100%; max-height: 60vh;
            filter: drop-shadow(0 0 28px var(--p));
            animation: float 5s ease-in-out infinite alternate;
        }
        .data {
            flex: 1 1 360px; padding: 48px 50px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .status { letter-spacing: 2px; font-size: 13px; color: var(--p); opacity: 0.85; margin: 0 0 6px; }
        h1 {
            font-size: clamp(34px, 5vw, 56px); margin: 0 0 22px;
            color: #fff; letter-spacing: 3px;
            text-shadow: 0 0 14px var(--p), 0 0 32px var(--s);
            border-bottom: 2px solid var(--s); padding-bottom: 12px;
        }
        .stats { list-style: none; padding: 0; margin: 0 0 26px;
            border-left: 3px solid var(--p); }
        .stats li { padding: 7px 0 7px 18px; font-size: 20px; line-height: 1.4; }
        .stats b { color: var(--p); text-shadow: 0 0 6px var(--p); margin-right: 8px; }
        .note {
            font-size: 15px; font-style: italic; color: #bfe6ff;
            border-left: 3px solid var(--s); padding-left: 14px; margin: 0 0 34px; opacity: 0.9;
        }
        .btn {
            align-self: flex-start; padding: 13px 34px;
            border: 2px solid var(--p); background: transparent; color: var(--p);
            text-decoration: none; font-weight: 700; letter-spacing: 3px; font-size: 15px;
            transition: .3s; text-transform: uppercase;
        }
        .btn:hover { background: var(--p); color: var(--bg); box-shadow: 0 0 32px var(--p); }
        @keyframes float { from { transform: translateY(-10px) scale(1); } to { transform: translateY(12px) scale(1.03); } }
        @keyframes pulse { from { opacity: .6; } to { opacity: 1; } }
        @keyframes rise { 0% { transform: translateY(0) scale(.4); opacity: 0; } 20% { opacity: .6; } 100% { transform: translateY(-105vh) scale(1); opacity: 0; } }
        @media (max-width: 720px) { .visual { border-right: none; border-bottom: 1px solid #ffd23f55; } .data { padding: 32px 26px; } }
    </style>
</head>
<body>
    <div class="aura"></div>

    <div class="frame">
        <div class="visual">
            <a href="https://calamitymod.wiki.gg/wiki/Queen_Bee" target="_blank" rel="noopener">
                <img src="../images/QueenBee.gif" alt="QUEEN BEE">

            <h1>QUEEN BEE</h1>
            <ul class="stats">
                <li><b>HEALTH:</b> 3,400 / 8,568</li>
                <li><b>CHARGE:</b> 30 / 81</li>
                <li><b>STINGER:</b> 22 / 66</li>

            </ul>
            <p class="note">Наносит тараны, призывает пчёл и выпускает вееры жал. Вне подземной джунгли впадает в ярость.</p>

    </div>
</body>
</html>
