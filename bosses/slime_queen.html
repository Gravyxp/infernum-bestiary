<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BOSS_DATA: QUEEN SLIME</title>
    <style>
        :root {
            --hallow-pink: #ff66cc;
            --hallow-blue: #66ccff;
            --crystal-bg: #1a0a1a;
        }

        body {
            margin: 0; padding: 0;
            background: var(--crystal-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        /* Задний фон с градиентом Освящения */
        .hallow-overlay {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255, 102, 204, 0.15) 0%, transparent 70%);
            z-index: -1;
        }

        /* Контейнер: Сияющий кристалл */
        .queen-container {
            width: 90vw; height: 85vh;
            display: flex;
            background: rgba(40, 10, 40, 0.8);
            border: 4px solid var(--hallow-pink);
            border-radius: 30px;
            box-shadow: 0 0 40px var(--hallow-pink), inset 0 0 60px rgba(102, 204, 255, 0.3);
            position: relative;
            backdrop-filter: blur(10px);
        }

        /* Визуал: Королева */
        .queen-visual {
            flex: 1.2;
            display: flex; justify-content: center; align-items: center;
            border-right: 2px solid var(--hallow-blue);
            position: relative;
        }

        .queen-visual img {
            max-width: 80%;
            filter: drop-shadow(0 0 30px var(--hallow-pink));
            animation: slimeFloat 4s ease-in-out infinite alternate;
        }

        /* Данные */
        .queen-data {
            flex: 1; padding: 50px;
            display: flex; flex-direction: column; justify-content: center;
        }

        h1 {
            font-size: 50px; color: var(--hallow-pink);
            text-shadow: 0 0 20px var(--hallow-pink), 2px 2px var(--hallow-blue);
            margin: 0 0 20px 0; text-transform: uppercase;
        }

        .stats-list {
            list-style: none; padding: 0; font-size: 24px; line-height: 2;
        }

        .stats-list li b { color: var(--hallow-blue); text-shadow: 0 0 10px var(--hallow-blue); }

        /* Эффект пузырьков */
        .bubble {
            position: absolute; background: rgba(255, 255, 255, 0.3);
            border-radius: 50%; pointer-events: none;
            animation: bubbleRise linear infinite;
        }

        .btn-back {
            margin-top: 40px; padding: 15px 30px;
            background: transparent; color: var(--hallow-pink);
            border: 2px solid var(--hallow-pink);
            text-decoration: none; text-align: center;
            transition: 0.4s; font-weight: bold;
        }

        .btn-back:hover {
            background: var(--hallow-pink); color: white;
            box-shadow: 0 0 30px var(--hallow-pink); transform: scale(1.05);
        }

        @keyframes slimeFloat {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-20px) scale(1.05); }
        }

        @keyframes bubbleRise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="hallow-overlay"></div>

    <div class="bubble" style="width:20px; height:20px; left:10%; animation-duration:8s;"></div>
    <div class="bubble" style="width:10px; height:10px; left:25%; animation-duration:5s; animation-delay:2s;"></div>
    <div class="bubble" style="width:15px; height:15px; left:80%; animation-duration:10s;"></div>

    <div class="queen-container">
        <div class="queen-visual">
            <img src="../images/Queen_Slime.gif" alt="Queen Slime">
        </div>

        <div class="queen-data">
            <h1>QUEEN SLIME</h1>
            <ul class="stats-list">
                <li><b>HEALTH:</b> 28,800 / 46,080</li>
                <li><b>DAMAGE:</b> 80 / 120</li>
                <li><b>DEFENSE:</b> 26</li>
                <li><b>LOCATION:</b> The Hallow</li>
            </ul>
            <p style="color: #ffccff; border-left: 3px solid var(--hallow-pink); padding-left: 15px;">
                // СИСТЕМНОЕ УВЕДОМЛЕНИЕ: <br>
                Обнаружена высокая концентрация кристаллической магии. <br>
                Остерегайтесь летающих Гелевых Слизней во второй фазе.
            </p>
            <a href="../bestiary/bestiary.html" class="btn-back">_RETURN_TO_BASE</a>
        </div>
    </div>

</body>
</html>
