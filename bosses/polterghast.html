<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Profile - Polterghast</title>
    <style>
        /* ГЛОБАЛЬНЫЕ СТИЛИ */
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; 
            background: #0d000d; /* Глубокий мистический фон */
            color: #eeeeee;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* КАРТОЧКА БОССА */
        .boss-container {
            display: flex;
            width: 90vw;
            height: 85vh;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            padding: 40px;
            background: rgba(20, 0, 30, 0.9);
            border-radius: 20px;
            /* НЕОНОВО-РОЗОВЫЙ ПРИЗРАЧНЫЙ КОНТУР */
            border: 2px solid #ff00ff;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.4), inset 0 0 15px rgba(0, 255, 200, 0.2);
        }

        /* ЛЕВАЯ ЧАСТЬ (СПРАЙТ) */
        .boss-visual {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .boss-visual img {
            max-width: 100%;
            max-height: 75vh;
            image-rendering: pixelated; 
            filter: drop-shadow(0 0 40px #ff00ff);
            /* Анимация: эффект агрессивного рывка */
            animation: dashAnim 1.5s infinite ease-in-out;
        }

        /* ПРАВАЯ ЧАСТЬ (ИНФОРМАЦИЯ) */
        .boss-data {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .boss-data h1 {
            font-size: 50px;
            margin: 0 0 30px 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffcc;
        }

        /* ХАРАКТЕРИСТИКИ */
        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stats-list li {
            font-size: 24px; 
            margin-bottom: 20px;
            display: flex;
            border-bottom: 1px solid rgba(0, 255, 200, 0.2);
            padding-bottom: 10px;
        }

        .stats-list li b {
            color: #ff00ff;
            width: 180px;
            text-transform: uppercase;
            font-size: 18px; 
            letter-spacing: 1px;
        }

        .spawn-item {
            color: #00ffcc;
            font-weight: bold;
            text-shadow: 0 0 5px #00ffcc;
        }

        /* КНОПКА ВОЗВРАТА */
        .btn-back {
            margin-top: 40px;
            font-size: 20px;
            color: #fff;
            text-decoration: none;
            border: 2px solid #ff00ff;
            padding: 12px 35px;
            border-radius: 10px;
            width: fit-content;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-back:hover {
            background: #ff00ff;
            color: #fff;
            box-shadow: 0 0 25px #ff00ff;
            transform: scale(1.05);
        }

        /* АНИМАЦИЯ РЫВКА */
        @keyframes dashAnim {
            0% { transform: scale(1) translate(0, 0); opacity: 1; }
            50% { transform: scale(1.1) translate(10px, -10px); opacity: 0.8; }
            100% { transform: scale(1) translate(0, 0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="boss-container">
        <div class="boss-visual">
            <img src="../images/Polterghast.gif" alt="Polterghast">
        </div>

        <div class="boss-data">
            <h1>Polterghast</h1>
            <ul class="stats-list">
                <li><b>Total HP:</b> 680,000</li>
                <li><b>Damage:</b> 340 (Contact)</li>
                <li><b>Defense:</b> 90</li>
                <li><b>Spawn:</b> <span class="spawn-item">Necroplasmic Beacon (Dungeon)</span></li>
                <li><b>Music:</b> Feral Amalgamation</li>
            </ul>
            
            <a href="../bestiary/bestiary.html" class="btn-back">Return to bestiary</a>
        </div>
    </div>

</body>
</html>
