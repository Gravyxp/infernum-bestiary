<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Profile - Devourer of Gods</title>
    <style>
        /* ГЛОБАЛЬНЫЕ СТИЛИ */
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; 
            background: #05000a; /* Космическая бездна */
            color: #eeeeee;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* КАРТОЧКА БОССА */
        .boss-container {
            display: flex;
            width: 90vw;
            height: 85vh;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            padding: 40px;
            background: rgba(10, 0, 20, 0.9);
            border-radius: 20px;
            /* КОСМИЧЕСКИЙ ФИОЛЕТОВЫЙ КОНТУР */
            border: 2px solid #a800ff;
            box-shadow: 0 0 40px rgba(168, 0, 255, 0.5), inset 0 0 20px rgba(0, 0, 0, 1);
        }

        /* ЛЕВАЯ ЧАСТЬ (СПРАЙТ) */
        .boss-visual {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .boss-visual img {
            max-width: 100%;
            max-height: 80vh;
            image-rendering: pixelated; 
            filter: drop-shadow(0 0 50px #a800ff);
            /* Анимация: эффект мерцания в пространстве */
            animation: cosmicShift 4s ease-in-out infinite alternate;
        }

        /* ПРАВАЯ ЧАСТЬ (ИНФОРМАЦИЯ) */
        .boss-data {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .boss-data h1 {
            font-size: 45px;
            margin: 0 0 30px 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 25px #a800ff;
        }

        /* ХАРАКТЕРИСТИКИ */
        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stats-list li {
            font-size: 24px; 
            margin-bottom: 20px;
            display: flex;
            border-bottom: 1px solid rgba(168, 0, 255, 0.3);
            padding-bottom: 10px;
        }

        .stats-list li b {
            color: #a800ff;
            width: 180px;
            text-transform: uppercase;
            font-size: 18px; 
            letter-spacing: 2px;
        }

        .spawn-item {
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
        }

        /* КНОПКА ВОЗВРАТА */
        .btn-back {
            margin-top: 40px;
            font-size: 20px;
            color: #fff;
            text-decoration: none;
            border: 2px solid #a800ff;
            padding: 12px 35px;
            border-radius: 10px;
            width: fit-content;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-back:hover {
            background: #a800ff;
            color: #fff;
            box-shadow: 0 0 30px #a800ff;
            transform: scale(1.05);
        }

        /* АНИМАЦИЯ КОСМИЧЕСКОГО СДВИГА */
        @keyframes cosmicShift {
            0% { transform: perspective(500px) rotateX(0deg) scale(1); filter: brightness(1) hue-rotate(0deg); }
            100% { transform: perspective(500px) rotateX(5deg) scale(1.05); filter: brightness(1.3) hue-rotate(20deg); }
        }
    </style>
</head>
<body>

    <div class="boss-container">
        <div class="boss-visual">
            <img src="../images/devourer-of-gods.png" alt="The Devourer of Gods">
        </div>

        <div class="boss-data">
            <h1>The Devourer of Gods</h1>
            <ul class="stats-list">
                <li><b>Total HP:</b> 2,556,000</li>
                <li><b>Damage:</b> 450 (Head)</li>
                <li><b>Defense:</b> 50</li>
                <li><b>Spawn:</b> <span class="spawn-item">Cosmic Worm (Anywhere)</span></li>
                <li><b>Music:</b> Scourge of the Universe</li>
            </ul>
            
            <a href="../bestiary/bestiary.html" class="btn-back">Return to bestiary</a>
        </div>
    </div>

</body>
</html>
