<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OCEAN_APEX: DUKE_FISHRON</title>
    <style>
        :root {
            --duke-cyan: #00ffff;
            --duke-blue: #0044ff;
            --duke-dark: #000a1a;
        }

        body {
            margin: 0; padding: 0; background: var(--duke-dark);
            color: var(--duke-cyan); font-family: 'Arial Black', sans-serif;
            overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        .ocean-blur {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(180deg, #001a33 0%, #000000 100%);
            z-index: 1;
        }

        .duke-frame {
            width: 92vw; height: 85vh; display: flex;
            background: rgba(0, 30, 60, 0.8);
            border: 4px solid var(--duke-cyan); position: relative;
            box-shadow: 0 0 50px var(--duke-blue), inset 0 0 30px var(--duke-blue);
            z-index: 2; border-radius: 0 50px 0 50px; overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .visual-section {
            flex: 1.3; display: flex; justify-content: center; align-items: center;
            border-right: 2px solid var(--duke-cyan); position: relative;
        }

        .visual-section img {
            max-width: 85%; filter: drop-shadow(0 0 30px var(--duke-cyan));
            animation: dukeDash 0.8s infinite alternate ease-in-out;
        }

        /* Эффект пузырьков */
        .bubble {
            position: absolute; background: rgba(255,255,255,0.2); border-radius: 50%;
            animation: rise 3s infinite linear; opacity: 0;
        }

        .info-section {
            flex: 1; padding: 60px; display: flex; flex-direction: column; justify-content: center;
        }

        h1 {
            font-size: 50px; font-style: italic; color: #fff;
            text-shadow: 0 0 20px var(--duke-cyan), 0 0 40px var(--duke-blue);
            margin: 0 0 20px 0; letter-spacing: 2px;
        }

        .speed-bar {
            height: 10px; background: var(--duke-blue); width: 100%;
            margin-bottom: 30px; position: relative; overflow: hidden;
        }
        .speed-bar::after {
            content: ''; position: absolute; top: 0; left: 0; width: 50%; height: 100%;
            background: var(--duke-cyan); animation: loading 1s infinite linear;
        }

        .stats {
            font-size: 22px; line-height: 2; color: #e0ffff;
            background: rgba(0,0,0,0.4); padding: 25px; border-radius: 15px;
        }
        .stats b { color: var(--duke-cyan); }

        .action-button {
            margin-top: 40px; padding: 15px 35px; border: 2px solid var(--duke-cyan);
            color: var(--duke-cyan); text-decoration: none; font-weight: bold;
            text-align: center; transition: 0.3s; letter-spacing: 3px;
        }
        .action-button:hover {
            background: var(--duke-cyan); color: #000;
            box-shadow: 0 0 40px var(--duke-cyan);
        }

        @keyframes dukeDash {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(20px, -10px); }
        }
        @keyframes rise {
            0% { transform: translateY(100%); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-100%); opacity: 0; }
        }
        @keyframes loading { from { left: -100%; } to { left: 100%; } }
    </style>
</head>
<body>
    <div class="ocean-blur"></div>
    <div class="duke-frame">
        <div class="visual-section">
            <div class="bubble" style="left: 20%; width: 20px; height: 20px; animation-delay: 0.5s;"></div>
            <div class="bubble" style="left: 60%; width: 10px; height: 10px; animation-delay: 1.2s;"></div>
            <img src="../images/Duke_Fishron.gif" alt="Duke Fishron">
        </div>
        <div class="info-section">
            <h1>DUKE FISHRON</h1>
            <div class="speed-bar"></div>
            <div class="stats">
                <b>HEALTH:</b> 60,000 / 100,000<br>
                <b>SPEED:</b> EXTREME (3 PHASES)<br>
                <b>DAMAGE:</b> 150 (Dash) / 100 (Bubbles)<br>
                <b>DEFENSE:</b> 50
            </div>
            <a href="../bestiary/bestiary.html" class="action-button">ESCAPE_THE_TYPHOON</a>
        </div>
    </div>
</body>
</html>
