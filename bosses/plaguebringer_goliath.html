<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BIOHAZARD: GOLIATH</title>
    <style>
        :root {
            --plague-green: #adff2f;
            --plague-dark: #0d1a00;
            --plague-warn: #ffcc00;
        }

        body {
            margin: 0; padding: 0; background: var(--plague-dark);
            color: var(--plague-green); font-family: 'Consolas', monospace;
            overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        /* Эффект ядовитого тумана */
        .fog-effect {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(173, 255, 47, 0.1) 0%, transparent 80%);
            animation: fogPulse 5s infinite ease-in-out; z-index: 1;
        }

        .goliath-frame {
            width: 90vw; height: 85vh; display: flex;
            background: rgba(10, 20, 0, 0.9);
            border: 3px solid var(--plague-green); position: relative;
            box-shadow: 0 0 40px var(--plague-green);
            z-index: 2; border-radius: 10px; overflow: hidden;
        }

        .visual-section {
            flex: 1.3; display: flex; justify-content: center; align-items: center;
            border-right: 2px solid var(--plague-green);
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(173,255,47,0.05) 3px);
        }

        .visual-section img {
            max-width: 80%; filter: drop-shadow(0 0 30px var(--plague-green));
            animation: goliathFly 3s infinite ease-in-out;
        }

        .info-section {
            flex: 1; padding: 50px; display: flex; flex-direction: column; justify-content: center;
        }

        .hazard-label {
            background: var(--plague-green); color: #000;
            font-weight: bold; padding: 10px; text-align: center;
            font-size: 20px; letter-spacing: 5px; animation: hazardBlink 1s infinite;
        }

        h1 {
            font-size: 40px; margin: 30px 0 10px 0; text-transform: uppercase;
            border-bottom: 2px solid var(--plague-green);
        }

        .stats-data {
            font-size: 20px; line-height: 1.8; margin-bottom: 40px;
            color: #d4ffaa;
        }
        .stats-data b { color: var(--plague-warn); }

        .action-button {
            padding: 15px 30px; background: transparent;
            border: 2px solid var(--plague-green); color: var(--plague-green);
            text-decoration: none; font-weight: bold; text-align: center;
            transition: 0.3s; text-transform: uppercase;
        }
        .action-button:hover {
            background: var(--plague-green); color: #000;
            box-shadow: 0 0 30px var(--plague-green);
        }

        @keyframes goliathFly {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        @keyframes hazardBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes fogPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body>
    <div class="fog-effect"></div>
    <div class="goliath-frame">
        <div class="visual-section">
            <img src="../images/plaquebringer_goliath.gif" alt="Plaguebringer Goliath">
        </div>
        <div class="info-section">
            <div class="hazard-label">!!! BIOHAZARD !!!</div>
            <h1>PLAGUEBRINGER GOLIATH</h1>
            <div class="stats-data">
                <b>HP:</b> 108,000 / 172,800<br>
                <b>ATK:</b> 150 (Dash) / 120 (Plague Barrage)<br>
                <b>DEF:</b> 50<br>
                <b>VIRUS:</b> PLAGUE_INFUSION_100%
            </div>
            <a href="../bestiary/bestiary.html" class="action-button">DECONTAMINATE_SESSION</a>
        </div>
    </div>
</body>
</html>
